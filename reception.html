<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Reception Invitation | Sahil & Aishwarya</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f1016;
            --bg-light: #1a1c29;
            --gold-light: #fcf6ba;
            --gold-mid: #d4af37;
            --gold-dark: #aa771c;
            --text-main: #f8fafc;
            --font-script: 'Great Vibes', cursive;
            --font-serif: 'Playfair Display', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-serif);
            background: radial-gradient(ellipse at bottom, var(--bg-light) 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ----- Ambient Background Animations ----- */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(252,246,186,0.8) 0%, rgba(212,175,55,0) 70%);
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* ----- Card Design (Glassmorphism) ----- */
        .card-wrapper {
            position: relative;
            z-index: 10;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            animation: slideUpFade 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* Glowing corner accents */
        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--gold-mid);
            filter: blur(80px);
            opacity: 0.15;
            z-index: -1;
        }
        .card::before { top: -50px; left: -50px; }
        .card::after { bottom: -50px; right: -50px; }

        /* ----- Typography ----- */
        .sub-heading {
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
            margin-bottom: 1rem;
            animation: fadeIn 2s ease forwards 0.5s;
            opacity: 0;
        }

        .title {
            font-family: var(--font-script);
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
            animation: shimmerText 5s linear infinite, scaleUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.8s;
            opacity: 0;
            transform: scale(0.9);
        }

        .ampersand {
            font-size: 2.5rem;
            color: var(--gold-mid);
        }

        .event-type {
            font-size: 1.4rem;
            font-style: italic;
            margin: 1.5rem 0 2rem;
            color: var(--gold-light);
            animation: fadeIn 2s ease forwards 1.2s;
            opacity: 0;
        }

        .divider {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-mid), transparent);
            margin: 0 auto 2rem;
        }

        .details p {
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
            line-height: 1.6;
            animation: fadeIn 2s ease forwards 1.4s;
            opacity: 0;
        }

        .details .bold {
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--gold-light);
            letter-spacing: 1px;
        }

        .details .venue {
            margin-top: 1.5rem;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
        }

        /* ----- Buttons ----- */
        .btn-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2.5rem;
            animation: slideUpFade 1.5s ease forwards 1.8s;
            opacity: 0;
        }

        .btn {
            text-decoration: none;
            color: var(--bg-dark);
            background: linear-gradient(135deg, #fcf6ba 0%, #d4af37 100%);
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #fff 0%, #fcf6ba 100%);
        }

        .btn-outline {
            background: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold-mid);
            box-shadow: none;
        }

        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.1);
            color: #fff;
        }

        /* ----- Keyframes ----- */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes scaleUp {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes shimmerText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .title { font-size: 2.8rem; }
            .card { padding: 2.5rem 1.5rem; }
            .btn-container { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Ambient Floating Particles -->
    <div id="particles"></div>

    <div class="card-wrapper">
        <div class="card">
            <p class="sub-heading">Together with their families</p>
            
            <h1 class="title">Sahil <span class="ampersand">&amp;</span> Aishwarya</h1>
            
            <p class="event-type">Joyfully invite you to their Reception</p>
            
            <div class="divider"></div>
            
            <div class="details">
                <p class="bold">Wednesday, 25th November 2026</p>
                <p>At 07:00 P.M. onwards</p>
                
                <div class="venue">
                    <p class="bold" style="margin-bottom: 5px;">Ganesh Lawn</p>
                    <p>A-130, Pannase Layout, Last Bus Stop,<br>Nagpur - 440022</p>
                </div>
            </div>

            <div class="btn-container">
                <a href="https://www.google.com/maps/search/?api=1&query=Ganesh+Lawn+Pannase+Layout+Last+Bus+Stop+Nagpur+440022" target="_blank" class="btn">View Map</a>
                <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Sahil+weds+Aishwarya+-+Reception&dates=20261125T133000Z/20261125T170000Z&location=Ganesh+Lawn,+Pannase+Layout,+Nagpur+440022&details=Reception+of+Sahil+and+Aishwarya" target="_blank" class="btn btn-outline">Add to Calendar</a>
            </div>
        </div>
    </div>

    <script>
        // JavaScript to generate dynamic glowing background particles
        document.addEventListener("DOMContentLoaded", () => {
            const particleContainer = document.getElementById('particles');
            const particleCount = 40;

            for (let i = 0; i < particleCount; i++) {
                createParticle();
            }

            function createParticle() {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Randomize properties for a natural look
                const size = Math.random() * 6 + 2; // 2px to 8px
                const posX = Math.random() * 100; // 0vw to 100vw
                const duration = Math.random() * 10 + 10; // 10s to 20s
                const delay = Math.random() * 10; // 0s to 10s

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}vw`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;

                particleContainer.appendChild(particle);

                // Recreate particle loop to keep the background infinite
                setTimeout(() => {
                    particle.remove();
                    createParticle();
                }, (duration + delay) * 1000);
            }
        });
    </script>
</body>
</html>
