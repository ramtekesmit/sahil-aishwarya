<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Invitation Link Maker</title>
<style>
:root{--ink:#14163a;--gold:#c9a24a;--ivory:#f7f1e3}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:#2a2a3d;font:17px/1.55 Georgia,'Times New Roman',serif;padding:1.2rem}
main{max-width:720px;margin:auto}
h1{color:var(--ink);font-weight:400;margin:.2rem 0 .3rem}
p.s{margin:.2rem 0 1rem;font-style:italic}
label{display:block;font-weight:bold;margin:1rem 0 .3rem;color:var(--ink)}
input,textarea{width:100%;font:inherit;padding:.6rem .7rem;border:1px solid var(--gold);background:#fff;border-radius:0}
input:disabled{background:#ece6d6;color:#555}
textarea{min-height:140px}
button,a.b{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:.5rem .9rem;text-decoration:none;display:inline-block}
a.wa{background:#1f8f4d;border-color:#1f8f4d}
button.sm{background:#fff;color:var(--ink);font-size:.92rem;padding:.4rem .7rem}
button.go{margin-top:1rem;background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:bold}
.row{display:grid;gap:.6rem;border:1px solid var(--gold);background:#fffaf0;padding:.8rem;margin-top:.8rem}
.row b{color:var(--ink);font-size:1.1rem}
.btns{display:flex;gap:.5rem;flex-wrap:wrap}
small{color:#666}
</style>
</head>
<body>
<main>
  <h1>Invitation Link Maker</h1>
  <p class="s">Type each guest's name. You get a personal WhatsApp invitation in Marathi and English for each one.</p>

  <label for="base">Invitation website</label>
  <input id="base" disabled>

  <label for="names">Guest names, one per line</label>
  <textarea id="names" placeholder="Rahul Sharma&#10;Meshram Family, 9876543210&#10;Anil Kaka and Family"></textarea>
  <small>Optional: add a comma and a 10-digit phone number, so WhatsApp opens that person's chat directly.</small>

  <button class="go" id="go">Make invitations</button>
  <div id="out"></div>
</main>
<script>
var BASE='https://ramtekesmit.github.io/sahil-aishwarya/';
var $=function(i){return document.getElementById(i)};
$('base').value=BASE;

// Fixed WhatsApp message (Marathi + English, each with its own link)
function message(name,mr,en){
  return name+",\n"+
    "साहिल व ऐश्वर्या यांच्या मंगल परिणय सोहळ्याचे आपणास सस्नेह निमंत्रण.\n"+
    "निमंत्रण पाहण्यासाठी (मराठी):\n"+mr+"\n\n"+
    "Dear "+name+",\n"+
    "You are cordially invited to the wedding of Sahil & Aishwarya.\n"+
    "Open your invitation (English):\n"+en;
}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e}
function copyBtn(label,link){
  var b=mk('button','sm',label);
  b.onclick=function(){
    (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(function(){b.textContent='Copied \u2713'},function(){prompt('Copy this link:',link)});
  };
  return b;
}
$('go').onclick=function(){
  var out=$('out');out.textContent='';
  $('names').value.split('\n').forEach(function(line){
    line=line.trim();if(!line)return;
    var parts=line.split(','),name=parts[0].trim(),ph=(parts[1]||'').replace(/\D/g,'');
    if(!name)return;
    var q=BASE+'?to='+encodeURIComponent(name);
    var en=q,mr=q+'&lang=mr';
    if(ph.length===10)ph='91'+ph;
    var row=mk('div','row'),btns=mk('div','btns');
    var w=mk('a','b wa','Send on WhatsApp');
    w.href='https://wa.me/'+ph+'?text='+encodeURIComponent(message(name,mr,en));
    w.target='_blank';w.rel='noopener';
    btns.appendChild(w);btns.appendChild(copyBtn('Copy Marathi link',mr));btns.appendChild(copyBtn('Copy English link',en));
    row.appendChild(mk('b',null,name));row.appendChild(btns);out.appendChild(row);
  });
};
</script>
</body>
</html>
